[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-fl"
version = "0.1.0"
description = "DriVE: a compact federated learning framework with server-side virtual evolution"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26", "PyYAML>=6", "torch>=2.3", "torchvision>=0.18", "Pillow>=9"]

[project.optional-dependencies]
audio = ["torchaudio>=2.3", "soundfile>=0.12"]

[tool.setuptools.packages.find]
include = ["fedhodge*"]

[tool.setuptools]
py-modules = ["train"]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[project.scripts]
drive-train = "train:main"
